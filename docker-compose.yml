# Quire Ink, self-hosted with Docker. One service. There is nothing to link it to.
#
#   cp .env.docker.example .env      # then edit the three values in it
#   docker compose up -d --build
#   docker compose exec quire bun run user create --username you --email you@example.com
#
# Upgrading is `git pull && docker compose up -d --build`. The schema is applied at boot,
# inside a transaction, so there is no migration command to remember. Take a backup first
# anyway (docs/backups.md).

services:
  quire:
    build: .
    restart: unless-stopped

    # Everything the app reads. The three required values live in `.env`; see
    # `.env.docker.example` for the optional ones.
    env_file: .env

    # These come AFTER env_file and therefore win. They are the container's own layout,
    # not preferences: the volumes below are mounted at exactly these paths, and a `.env`
    # that redefined them would point the app at a directory nothing is mounted on, where
    # it would happily write a database that vanishes with the container.
    environment:
      DATA_DIR: /var/lib/quire/data
      STORAGE_LOCAL_DIR: /var/lib/quire/uploads
      PORT: 3000

    # Bound to loopback ON PURPOSE. Quire Ink expects a reverse proxy in front of it for TLS
    # and for the security headers in docs/self-host.md, and a plain `3000:3000` publishes
    # the app to the whole internet THROUGH a host firewall: Docker writes its own iptables
    # rules, so ufw showing "deny" is not the protection it looks like. Serving it directly
    # is a deliberate edit, not a default.
    ports:
      - "127.0.0.1:3000:3000"

    # NAMED volumes, and they stay the default because they need no decisions: a fresh one
    # inherits the ownership of the image's directory, so the app can write to it on first
    # boot with nothing else running. `docker compose cp` and the backup route both get data
    # out without a bind mount.
    #
    # Bind mounts ARE supported now, which they were not before 2026-08-21 — a root-owned
    # host directory used to kill the container on boot. Point these at host paths and set
    # `PUID`/`PGID` to whoever owns them (see `.env.docker.example`); the entrypoint adopts
    # the directories once and drops to that user. That is the shape a NAS wants.
    volumes:
      - quire-data:/var/lib/quire/data
      - quire-uploads:/var/lib/quire/uploads

    # The healthcheck is INHERITED from the image (see HEALTHCHECK in the Dockerfile), so
    # `docker run` gets the same probe and there is one definition rather than two that
    # drift. Overriding it here is a deliberate act, not a default.

    # Logs are capped, because the default json-file driver is not. A self-hosted blog runs
    # for years on a small disk, and an uncapped access log is a slow way to fill it: this
    # keeps at most 30 MB per container and drops the oldest first.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # No new privileges: nothing in this image needs setuid, and saying so costs nothing.
    # NOTE what is deliberately NOT here: `read_only: true`. The backup route stages the
    # archive in the system temp directory (`src/server/backup.ts` uses `os.tmpdir()`), so a
    # read-only root needs a tmpfs at /tmp — and a tmpfs is RAM, which turns a backup of a
    # site with a few hundred MB of uploads into an OOM on exactly the small box this
    # section is written for. Hardening that trades the backup button for a tidier flag is
    # the wrong trade.
    security_opt:
      - no-new-privileges:true

volumes:
  quire-data:
  quire-uploads:
