# `kubectl apply -k deploy/kubernetes` — kustomize is built into kubectl, so this adds no
# tool to install and no chart to template.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml
  # Drop this line if something else already terminates TLS for you.
  - ingress.yaml

# No `commonLabels` here, though it is the usual line: every object above already carries
# `app.kubernetes.io/name: quire` where a selector needs it, and the field is deprecated in
# newer kustomize while its replacement is not understood by older kubectl. A label this
# file does not need is not worth a version floor on the tool.

# THE ONE VALUE TO EDIT. Everything else the blog needs — its name, its language, SMTP,
# Turnstile, the CDN — is entered in the admin and stored in the database, so there is no
# config file to keep in sync with a running site.
#
# The address matters because it is not discoverable from inside a cluster: feeds, sitemaps,
# OG images and the links in a newsletter are all built from it, and without it they are
# built from whatever hostname the ingress passed through, which is an internal one.
configMapGenerator:
  - name: quire-config
    literals:
      - SITE_URL=https://blog.example.com
      # The Content-Security-Policy, sent by the app itself.
      #
      # HERE rather than as an ingress annotation because it has to work whatever controller
      # this cluster runs: ingress-nginx, Traefik and the cloud ones each spell a response
      # header differently, and a policy that only lands on one of them is a policy most
      # clusters do not get. The app sends it verbatim when this is set and sends none when
      # it is not, so nothing here narrows a policy your ingress already adds.
      #
      # Character for character the one in `Caddyfile` and `docs/self-host.md`: it is what
      # every production instance runs, so embeds are tested against it. With Cloudflare
      # Turnstile keys in Settings, use the second line instead.
      - "CSP=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://open.spotify.com https://www.youtube-nocookie.com; upgrade-insecure-requests"
      # - "CSP=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://challenges.cloudflare.com https://open.spotify.com https://www.youtube-nocookie.com; upgrade-insecure-requests"
      # Uncomment on a cluster whose ingress controller is NOT on a private address —
      # a tunnel, or a load balancer that talks to the pod from a public one. Left alone,
      # a proxy on 10.x is already trusted for `X-Forwarded-For` and this is not needed.
      # - TRUST_PROXY=1
      # The day boundary the analytics use. UTC unless this says otherwise.
      # - ANALYTICS_TZ=Asia/Ho_Chi_Minh

# A rolled ConfigMap name would restart the pod on every unrelated `apply`; the blog reads
# these at boot and a restart is a short outage, so the name stays put and a change to the
# address is followed by an explicit `kubectl rollout restart statefulset/quire`.
generatorOptions:
  disableNameSuffixHash: true
