# Update Quire Ink, for a blog made with the Deploy to Cloudflare button (ADR 0066).
#
# Cloudflare deploys whatever reaches main in the owner's copy, which is not a fork: no "Sync fork",
# so this is it. Run it from Actions. It brings a release in file for file (the newest, or the one
# asked for), keeps the Worker and bucket names in wrangler.jsonc, commits and pushes; the blog
# migrates its database on its next start, after a bookmark (30 days of restorable history).
#
# THE BUTTON DOES NOT COPY THIS FILE: its import leaves .github/workflows out (2026-10-04). The
# Cloudflare card in Settings opens GitHub's new-file page with it filled in, from
# src/install/cloudflare/update-quireink.yml, which a test holds equal to this file.
#
# It leaves .github/workflows alone: a workflow's token may not push workflow files, and trying
# would refuse the whole push. Never runs in joiha-steven/quireink itself or in a fork.
name: Update Quire Ink

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to install, e.g. 2.2.17 (blank for the newest)
        required: false

permissions:
  contents: write

jobs:
  update:
    if: github.repository != 'joiha-steven/quireink' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bring the release in
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${WANT}" ]; then tag="v${WANT#v}"; else tag=$(gh api repos/joiha-steven/quireink/releases/latest --jq .tag_name); fi
          # A published release and nothing else: a version number, a release page behind it that is
          # not a draft or a pre-release, and not older than what this copy runs — older code over a
          # database the newer one already migrated is the one thing an update must never do.
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::${tag} is not a version like 2.2.17"; exit 1; fi
          state=$(gh api "repos/joiha-steven/quireink/releases/tags/${tag}" --jq '"\(.draft) \(.prerelease)"' 2>/dev/null || echo missing)
          if [ "${state}" != "false false" ]; then echo "::error::${tag} is not a published release of Quire Ink"; exit 1; fi
          current=$(grep -m1 -oE '"version": *"[^"]*"' package.json | sed -E 's/.*"([^"]*)"$/\1/')
          if [ "$(printf '%s\n%s\n' "${current}" "${tag#v}" | sort -V | head -1)" != "${current}" ]; then
            echo "::error::this blog runs ${current}; ${tag#v} is older, and going back is a restore from a backup, not an update"; exit 1
          fi
          echo "installing ${tag}"
          # The names the button chose: the Worker's (the first "name" in the file) and the bucket's.
          name=$(grep -m1 -oE '"name": *"[^"]*"' wrangler.jsonc | sed -E 's/.*"([^"]*)"$/\1/')
          bucket=$(grep -m1 -oE '"bucket_name": *"[^"]*"' wrangler.jsonc | sed -E 's/.*"([^"]*)"$/\1/')
          git fetch --depth 1 https://github.com/joiha-steven/quireink.git "refs/tags/${tag}"
          git rm -rq -- . ':(exclude).github/workflows'
          git checkout FETCH_HEAD -- . ':(exclude).github/workflows'
          sed -i -E "0,/\"name\": *\"[^\"]*\"/s//\"name\": \"${name}\"/" wrangler.jsonc
          sed -i -E "s/\"bucket_name\": *\"[^\"]*\"/\"bucket_name\": \"${bucket}\"/" wrangler.jsonc
          git add -A
          if git diff --cached --quiet; then echo "already on ${tag}"; exit 0; fi
          git -c user.name="Quire Ink update" -c user.email="actions@users.noreply.github.com" commit -qm "Quire Ink ${tag}"
          git push
          echo "### Quire Ink ${tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed. Cloudflare deploys it in a few minutes; the blog's /api/health then names ${tag#v}." >> "$GITHUB_STEP_SUMMARY"
