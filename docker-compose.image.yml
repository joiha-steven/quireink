# Quire Ink with HTTPS, without a checkout.
#
#   curl -O https://raw.githubusercontent.com/joiha-steven/quireink/main/docker-compose.image.yml
#   curl -O https://raw.githubusercontent.com/joiha-steven/quireink/main/Caddyfile
#   printf 'SITE_URL=https://example.com\n' > .env
#   docker compose -f docker-compose.image.yml pull        # see below: not optional
#   docker compose -f docker-compose.image.yml up -d
#   docker compose -f docker-compose.image.yml logs quire   # the link that claims the blog
#
# THE PULL IS NOT DECORATION. `up` uses a local image if one is already there and says nothing
# about its age: on a machine that had pulled once before, `latest` started a blog two
# releases behind the tag it named, printed a claim link, and looked entirely correct. Found by
# reading the version in its own log rather than by anything going wrong. Upgrading is
# `pull` then `up -d`, and the day it matters is months from now.
#
# The difference from `docker-compose.caddy.yml` is one line: that file says `build: .` and
# this one names the published image. It exists because the two were not interchangeable and
# the docs offered them as if they were. `pull quireink/quireink` was listed beside the Caddy
# compose as an equal way in, and it is not: both compose files build from source, so the
# reader who came for the image had no way to get the certificate with it. They got the app on
# loopback and were left to find a proxy themselves — which is the step the Caddy file exists
# to remove.
#
# TWO files rather than one, and deliberately: the `Caddyfile` beside this is the SAME file
# the checkout uses. Inlining it here would make a second copy of a security-relevant
# configuration — the CSP the application is tested against lives in it — and two copies of
# that drift without anything going red.
#
# `latest` moves, and a pinned tag is the other half of the trap above: pin a release
# (`quireink/quireink:2.2.4`) on a machine where an upgrade should be a decision rather than a
# restart, and then `pull` cannot surprise you either.

services:
  quire:
    image: quireink/quireink:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /var/lib/quire/data
      STORAGE_LOCAL_DIR: /var/lib/quire/uploads
      PORT: 3000
      # Caddy reaches it over the compose network, so loopback would refuse that connection.
      # Nothing outside the network can: no `ports:` here at all.
      HOST: 0.0.0.0
    volumes:
      - quire-data:/var/lib/quire/data
      - quire-uploads:/var/lib/quire/uploads
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [quire]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    environment:
      # The Caddyfile uses this as its site address and takes the certificate's name out of
      # it. The host must already point at this machine, or the certificate cannot be issued
      # and Caddy will say so in its log.
      SITE_URL: ${SITE_URL:?set SITE_URL in .env, e.g. https://example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named, and worth keeping: it holds the certificates and the account key. Losing it
      # means new certificates on the next start, which Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  quire-data:
  quire-uploads:
  caddy-data:
  caddy-config:
