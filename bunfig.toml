# Tests live beside the code they cover, so the runner is rooted at `src`. Nothing outside
# it defines a test, and rooting it here stops a stray `.test.ts` under `scripts`, or a file
# left in a scratch directory, from joining the run by accident.
[test]
root = "src"
# NOTHING IS PRELOADED. There was a plugin here that re-transpiled `src/admin/*.tsx` with the
# React runtime, because `bun test` compiles every file with the ROOT tsconfig and the admin's
# JSX was React's. There is no `.tsx` in this repository since ADR 0054's step 6, so the
# plugin's filter could not match a file and it was loading for nothing.
