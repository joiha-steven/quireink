name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ON A CLOCK AS WELL, for the `audit` job alone. Every other job here answers a question
  # about a commit, and a commit that has not changed cannot change its answer; an advisory
  # is published on somebody else's calendar. Measured 2026-09-04: the tree on `main` had
  # seven open advisories (four high), every one published after the last green run two
  # days earlier, and nothing in this repository would have said so until the next push.
  # Dependabot cannot fill that gap because it does not read `bun.lock` (see `audit`).
  # Monday 03:00 UTC, before the working week in every timezone this project deploys to.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Bun, not Node. The runtime IS Bun since 2.0 (ADR 0005), so there is no
      # package-lock.json for setup-node to cache against — which is exactly how this job
      # was failing. It never reached a test: it died looking for a lockfile that this
      # repository has not had since the cutover.
      #
      # PINNED, not `latest`. The golden suite compares article bodies byte for byte, which
      # is why `marked` and `shiki` carry exact versions with no caret; running that
      # comparison on whatever runtime shipped this morning gives away the same guarantee at
      # the other end. A Bun release that changes behaviour should turn this job red in a
      # commit that says so, not on a random Tuesday. Bump it deliberately.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The full offline gate: typecheck, the static guards (filesize / css / nul / routes /
      # type / admin-kit / docs) and the test suite. Needs no backend env — SQLite is
      # in-process and every test opens its own database in a temp directory.
      - run: bun run check:all
      # And what actually gets deployed must still build: the reader's asset bundles and the
      # admin SPA, which `deploy.sh` ships and the server reads off disk at boot.
      #
      # This step used to compile a standalone executable, and exited 0 while producing something
      # that could not start — `sharp`'s native module does not embed, so the process died before
      # it listened. A green check on an artefact nobody may deploy is worse than no check.
      # [ADR 0022](../../docs/decisions/0022-ship-from-source-not-a-compiled-binary.md).
      - run: bun run build

  # THE TOUR — a real browser through sixty-one real flows, plus the restore check.
  #
  # This job is the answer to CLAUDE.md's own admission: `check:all` proves the code
  # compiles and the seams hold, and cannot tell you a page went blank. The tour was built
  # to close exactly that blind spot — and then lived only as a command someone had to
  # remember to run, which is how six bugs cleared 1,954 green tests on 2026-08-27. A
  # verification tool that depends on memory is the failure mode every static guard in
  # `scripts/checks/` was written to kill; this job applies the same cure to the tour.
  #
  # Chrome is preinstalled on ubuntu-latest at /usr/bin/google-chrome, which
  # `scripts/chrome-path.ts` finds on its own. The tour seeds its own instance on port
  # 3399 and deletes it after; nothing here needs secrets or network beyond the runner
  # (UPDATE_CHECK=0 inside tour.sh keeps it off check.quireink.com).
  #
  # SEPARATE JOB, not a step in `check`, for the same reason `audit` is: a red tour on a
  # green check is a real state — the code is consistent AND a page is broken — and the
  # log should be able to show it.
  tour:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # THE BROWSER THE PROJECT ACTUALLY TARGETS, installed rather than inherited.
      #
      # `chrome-path.ts` prefers `chrome-headless-shell` under `$HOME/chrome` and falls back
      # to whatever the machine happens to carry. On a runner that is `/usr/bin/chromium` —
      # the entry the source itself calls a last resort — and it has now hung twice on a
      # cold start, holding the debugging port shut for the full thirty seconds while
      # complaining about a D-Bus it has no business needing (run 33618728673, and #597
      # before it, which passed on a rerun of the same commit). Neither failure was about
      # the code being toured.
      #
      # Pinning the browser is what makes the tour a test of this repository rather than of
      # whatever Chromium the image shipped that week. Cached, so it costs one download per
      # runner image rather than one per run.
      - uses: actions/cache@v4
        id: headless-shell
        with:
          path: ~/chrome
          key: chrome-headless-shell-stable-${{ runner.os }}
      - if: steps.headless-shell.outputs.cache-hit != 'true'
        run: bunx @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/chrome"
      # tour.sh builds the assets and the admin itself, seeds, serves, drives, restores.
      - run: bun run tour

  # THE IMAGE, built and actually started. Nothing else in this repository looks at the
  # Docker path: measured 2026-08-21, `Dockerfile` appeared in no test, no tour flow and no
  # workflow, so it could have stopped building weeks earlier and every check here would
  # still have been green. That is the same shape as the book-mode regression found the same
  # day — a feature with no flow is a feature that can die quietly — and it matters more
  # here, because the people this image is for are the least able to debug it.
  #
  # It BOOTS the container rather than only building it, and boots it the way a NAS does.
  # `docker compose up` mounts named volumes, which Docker seeds from the image with the
  # right ownership, so that path was never going to fail; a Synology, QNAP or Unraid box
  # bind-mounts a real root-owned folder instead, and on 2026-08-21 that killed the
  # container on boot with `SQLITE_CANTOPEN`. Both shapes are asserted below, and the
  # bind-mount one is the reason this job exists at all.
  #
  # Ubuntu, so the ownership is REAL. The same test on a Mac passes against a broken image:
  # Docker Desktop maps ownership across its file share, so a root-owned bind mount silently
  # behaves as if it belonged to the container user. Do not "simplify" this onto a developer
  # machine and believe the result.
  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t quireink:ci .

      # A root-owned bind mount: what a NAS container UI produces, and what used to crash.
      - name: it boots on a root-owned bind mount
        run: |
          sudo mkdir -p /srv/nas-sim/data /srv/nas-sim/uploads
          docker run -d --name qi-bind -e SITE_URL=http://localhost:3000 \
            -p 127.0.0.1:3000:3000 \
            -v /srv/nas-sim/data:/var/lib/quire/data \
            -v /srv/nas-sim/uploads:/var/lib/quire/uploads quireink:ci
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = 200 ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"' \
            || { docker logs qi-bind; exit 1; }
          # And it is not root that got it working. The app running as UID 0 would pass the
          # health check just as well, which is exactly why this is asserted separately.
          test "$(docker exec qi-bind sh -c 'grep ^Uid: /proc/1/status' | awk '{print $2}')" = 1000 \
            || { echo 'the app is running as root'; exit 1; }
          docker rm -f qi-bind

      # The compose path, unchanged by any of the above: named volumes, no chown, no adopt.
      - name: it boots on named volumes without adopting anything
        run: |
          docker run -d --name qi-vol -e SITE_URL=http://localhost:3000 \
            -p 127.0.0.1:3000:3000 \
            -v qi-d:/var/lib/quire/data -v qi-u:/var/lib/quire/uploads quireink:ci
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = 200 ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"' \
            || { docker logs qi-vol; exit 1; }
          # `if`, not `A && B`: Actions runs these with `bash -e`, and a plain `grep -q ...
          # && { exit 1; }` fails the STEP on the good path, where grep finds nothing.
          if docker logs qi-vol 2>&1 | grep -q adopting; then
            echo 'chowned a volume that was already correct'; exit 1
          fi
          docker rm -f qi-vol

  # The dependency advisories, because NOTHING ELSE HERE LOOKS AT THEM and Dependabot
  # cannot.
  #
  # Measured 2026-08-11: `bun audit` found five advisories — one high (`fast-uri`, reached
  # through `@modelcontextprotocol/sdk › ajv`) and four on `hono` — while the repository's
  # Dependabot alert list was empty. The dependency graph GitHub builds for this repository
  # holds 34 packages, which is `package.json`'s direct dependencies and not a resolved
  # tree: **`bun.lock` is not parsed**. So a transitive advisory can never raise an alert
  # here, and a direct one does not either when the caret range in the manifest permits a
  # patched version while the lockfile pins a vulnerable one — which is exactly the state
  # `hono` was in. Every alert this repository has ever received named
  # `v1/package-lock.json`, a tree ADR 0019 deleted.
  #
  # `bun audit` reads the lockfile, so it sees what is actually installed. It exits 1 on any
  # finding, and that is deliberately left at the default level rather than raised to
  # `--audit-level=high`: a low-severity advisory on a package this application does not
  # call is still a sentence worth reading once, and the alternative is a job that stays
  # green while something is true.
  #
  # SEPARATE JOB, not a step in `check`, because the two answer different questions. `check`
  # says the code is correct; this says the tree it runs on has a published problem. A red
  # `audit` on a green `check` is a real state and the log should be able to show it.
  #
  # When this goes red: read the advisory, then establish whether the vulnerable path is
  # REACHABLE before treating it as an incident. On 2026-08-11 none of the four `hono` ones
  # was — `hono/cookie` is the only `hono/*` import in the tree, and `memo(`, `hono/cors`,
  # `hono/language` and `hono/proxy` appear nowhere — so the bump was hygiene. If a finding
  # is ever unreachable AND unfixable, `bun audit --ignore=<id>` takes it, and the reason
  # and the date belong in a comment here beside it. Not silently.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Three tries, twenty seconds apart. The advisory database is a network call, and one
      # run on 2026-09-04 went red with `ConnectionClosed: audit request failed` and not one
      # advisory in it; on the Monday schedule that is a red mail about nothing. A real
      # advisory fails all three tries the same way, so nothing real is retried away.
      - run: |
          for try in 1 2 3; do
            bun audit && exit 0
            [ "$try" -lt 3 ] && echo "audit did not complete (try $try), retrying in 20s" && sleep 20
          done
          exit 1
